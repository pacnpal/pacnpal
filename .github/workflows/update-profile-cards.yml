name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *" # daily, off the top of the hour to dodge Actions queue spikes
  workflow_dispatch:

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Classic PAT with read:user (add repo to count private work).
      # GITHUB_TOKEN is repo-scoped and gets "Resource not accessible by integration" on user stats.
      STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}

    steps:
      - name: Require PROFILE_STATS_TOKEN
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Add a repo secret named PROFILE_STATS_TOKEN (classic PAT, read:user scope)."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: "true"

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical
          path: profile/top-langs.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: "true"

      # Renders locally with the upstream generator; no dependency on the overloaded Vercel instances.
      - name: Trophy card
        uses: ryo-ma/github-profile-trophy@43736b50a82fca73c8df1c81abb40aa03519975c
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ env.STATS_TOKEN }}
          theme: onedark

      - name: Strip leading whitespace so GitHub renders the SVGs
        run: |
          sed -i '/./,$!d' profile/*.svg
          sed -i '1s/^[[:space:]]*//' profile/*.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile cards"
          git push
